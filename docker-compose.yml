services:
  db:
    image: postgres:14
    environment:
      POSTGRES_USER: ccyuwen
      POSTGRES_PASSWORD: ccyuwen
      POSTGRES_DB: ccyuwen
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccyuwen"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      DATABASE_URL: postgresql://ccyuwen:ccyuwen@db:5432/ccyuwen
      JWT_SECRET: ccyuwen-dev
      DATA_ROOT: /app/data
      RAW_ROOT: /app/raw
    volumes:
      - ./server/data:/app/data
      - ./raw:/app/raw
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
